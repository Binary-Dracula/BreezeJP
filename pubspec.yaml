name: breeze_jp
description: "A new Flutter project."
publish_to: "none"
version: 0.1.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 国际化
  intl: ^0.20.2
  # 状态管理
  flutter_riverpod: ^3.0.3
  # SQLite
  sqflite: ^2.3.3
  path: ^1.9.0
  # 路由导航
  go_router: ^17.0.0
  # 音频库
  just_audio: ^0.10.5
  # 文本组件
  # 动画
  flutter_animate: ^4.5.0
  # 手势操作
  gesture_x_detector: ^1.1.1
  # JSON
  json_annotation: ^4.9.0
  # 英文转罗马音
  kana_kit: ^2.1.1
  # 沙盒路径获取
  path_provider: ^2.1.5
  # 网络请求
  dio: ^5.7.0
  # 日志
  logger: ^2.5.0
  xml: ^6.6.1
  fl_chart: ^1.1.1
  freezed_annotation: ^3.1.0
  scrollable_positioned_list: ^0.3.8
  record: ^6.2.0
  ruby_text: ^3.0.3
  # TTS
  voicevox_core: ^0.1.0
  ffi: ^2.1.2
  shared_preferences: ^2.5.4
  # Supabase 认证
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.8.0
  freezed: ^3.2.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "files/icon_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "files/icon_launcher.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/database/breeze_jp.sqlite
    - assets/audio/kana/
    - assets/mock/
    - assets/tts/voicevox/dict/
    - assets/tts/voicevox/model/
